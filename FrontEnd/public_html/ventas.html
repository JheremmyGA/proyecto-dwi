<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <!-- BOX ICONS -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="Css/menu.css">
    <link rel="stylesheet" href="Css/inventario.css">
    <link rel="stylesheet" href="Css/ventas.css">
    <!-- CUSTOM JS -->
    
    <script src="Javascript/ventas.js" defer></script>
    <script src="Javascript/inventario.js" defer></script>
</head>
<body>

    <div class="menu-dashboard">
        <!-- TOP MENU -->
        <div class="top-menu">
            <a href="menu.html" class="logo">
                <img src="imagenes/logo.png" alt="">
                <span>Administrador</span>
            </a>
            <div class="toggle">
                <i class='bx bx-menu'></i>
            </div>
        </div>
        <!-- MENU -->
        <div class="menu">
            <a href="dashboard.html" class="enlace">
                <i class="bx bx-grid-alt"></i>
                <span>Dashboard</span>
            </a>

            <a href="inventario.html" class="enlace">
                <i class="bx bx-file-blank"></i>
                <span>Inventario</span>
            </a>

            <a href="ventas.html" class="enlace">
                <i class="bx bx-cart"></i>
                <span>Ventas</span>
            </a>

            <a href="index.html" class="enlace">
                <i class="bx bx-user"></i>
                <span>Vista usuario</span>
            </a>

            <a href="Login.html" class="enlace">
                <i class='bx  bx-arrow-in-down-left-square'></i>
                <span>Salir</span>
            </a>

        </div>
        <div class="menu-pie">
            <a href="menu.html" class="enlace" style="margin:0; border: none; padding: 10px 0; width: 100%;">
                <i class="bx bx-user"></i>
                <div class="info">
                    <span style="font-weight: 700;">Marcelo M.</span> <!--- Nombre del usuario -->
                    <span class="rol">Administrador</span>
                </div>
            </a>
        </div>

    </div>

    <div class="main-content" id="main-content">
        <div class="contenedor-principal">
            
            <div class="cabecera-ventas">
                <h2 class="titulo-seccion">Histórico de ventas</h2>
                
                <div class="buscador-filtros">
                    <div class="buscador-contenedor">
                        <i class='bx bx-search'></i>
                        <input type="text" placeholder="Buscar ID Boleta..." class="input-buscador">
                    </div>
                    <!-- Área donde se muestran filtros activos como badges -->
                    <div class="filtros-activos" aria-live="polite"></div>
                    
                        <div class="filtro-fecha-contenedor">
                            <button class="boton-filtro-fecha" title="Filtrar por Fecha">
                                <i class='bx bx-calendar'></i>
                            </button>
                            <div class="filtro-fecha-rango" style="display: none;">
                                <input type="date" class="input-fecha-inicio" aria-label="Fecha inicio">
                                <span class="separador-fecha">a</span>
                                <input type="date" class="input-fecha-fin" aria-label="Fecha fin">
                                <button class="boton-aplicar-fecha" title="Aplicar filtro">Aplicar</button>
                            </div>
                        </div>
                    
                    <button class="boton-accion-secundario" title="Limpiar Filtros">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
            </div>

            <div class="tabla-contenedor">
                <table class="tabla-ventas">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Fecha</th>
                            <th style="width: 10%;">ID Boleta</th>
                            <th style="width: 38%;">Producto</th>
                            <th style="width: 7%;">Unid.</th>
                            <th style="width: 15%; text-align: right;">Costo (S/.)</th>
                            <th style="width: 15%; text-align: right;">Sub-total (S/.)</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla-ventas">
                    </tbody>
                </table>
                
                <div style="display: flex; justify-content: flex-end; align-items: center; padding-top: 15px;">
                    <span class="importe-total">IMPORTE TOTAL:</span>
                    <span id="importe-total" class="importe-total">10.00</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
