<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Kivora</title>
    <link rel="stylesheet" href="../Css/Usuario.css">
</head>
<body>
    <header>Mi Cuenta</header>

    <div class="container">
        <h2>Datos del Usuario</h2>

        <div class="info">
            <label>Nombre:</label>
            <span id="nombreUsuario"></span>
        </div>

        <div class="info">
            <label>Apellido:</label>
            <span id="apellidoUsuario"></span>
        </div>

        <div class="info">
            <label>Celular:</label>
            <span id="celularUsuario"></span>
        </div>

        <div class="info">
            <label>Correo:</label>
            <span id="correoUsuario"></span>
        </div>

        <a href="index.html" class="boton-volver">Volver al Inicio</a>
    </div>

    <script src="Usuario.js"></script>
