<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <!-- BOX ICONS -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link href='https://cdn.boxicons.com/3.0.3/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="Css/menu.css">
    <link rel="stylesheet" href="Css/inventario.css">
    <!-- CUSTOM JS -->
    <script src="Javascript/menu.js" defer></script>
    <script src="Javascript/inventario.js" defer></script>
</head>

<body>

    <div class="menu-dashboard">
        <!-- TOP MENU -->
        <div class="top-menu">
            <a href="menu.html" class="logo">
                <img src="imagenes/logo.png" alt="">
                <span>Administrador</span>
            </a>
            <div class="toggle">
                <i class='bx bx-menu'></i>
            </div>
        </div>
        <!-- MENU -->
        <div class="menu">
            <a href="dashboard.html" class="enlace">
                <i class="bx bx-grid-alt"></i>
                <span>Dashboard</span>
            </a>

            <a href="inventario.html" class="enlace">
                <i class="bx bx-file-blank"></i>
                <span>Inventario</span>
            </a>

            <a href="ventas.html" class="enlace">
                <i class="bx bx-cart"></i>
                <span>Ventas</span>
            </a>

            <a href="index.html" class="enlace">
                <i class="bx bx-user"></i>
                <span>Vista usuario</span>
            </a>


            <div class="enlace">
                <i class="bx bx-cog"></i>
                <span>Configuración</span>
            </div>

            <div class="enlace">
                <i class='bx  bx-arrow-in-down-left-square'></i>
                <span>Salir</span>
            </div>

        </div>
        <div class="menu-pie">
            <a href="index.html" class="enlace" style="margin:0; border: none; padding: 10px 0; width: 100%;">
                <i class='bx bx-arrow-in-down-left-square'></i>
                <div class="info">
                    <span style="font-weight: 700;">Stefa Chavez</span> <!--- Nombre del usuario -->
                    <span class="rol">Administrador</span>
                </div>
            </a>
        </div>

    </div>
        <div class="contenedor-principal">
        <!-- Cabecera y acciones de la vista -->
        <div class="cabecera-inventario">
            <h2 class="titulo-seccion">Administrar Productos</h2>
            
            <div class="acciones-cabecera">
                <!-- Buscador -->
                <div class="buscador-contenedor">
                    <i class='bx bx-search'></i>
                    <input type="text" placeholder="Buscar..." class="input-buscador">
                </div>
                <!-- Filtros (simulado) -->
                <button class="boton-filtros">
                    <i class='bx bx-filter' style="margin-right: 5px;"></i>
                    Filtros
                </button>
                
                <!-- Botones de Acción Global -->
                <div class="grupo-botones">
                    <button class="boton-accion-principal">AGREGAR</button>
                    <!-- Iconos de vista (simulados) -->
                    <button class="boton-accion-secundario"><i class='bx bx-list-ul'></i></button>
                    <button class="boton-accion-secundario"><i class='bx bx-table'></i></button>
                </div>
            </div>

            <!-- Botón VOLVER -->
            <button class="boton-accion-principal" style="background-color: var(--color-peligro);">VOLVER</button>
        </div>

        <!-- Tabla de Inventario -->
        <div class="tabla-contenedor">
            <table class="tabla-inventario">
                <thead>
                    <tr>
                        <th style="width: 15%;">SKU</th>
                        <th style="width: 45%;">Nombre</th>
                        <th style="width: 10%;">Stock</th>
                        <th style="width: 30%;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-productos">
                    <!-- Filas de productos se insertarán aquí por JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

        <div id="modal-advertencia" class="modal-fondo" style="display: none;">
        <div class="modal-contenido">
            <i class='bx bxs-error-circle icono-alerta-grande'></i>
            <h3>Atención</h3>
            <p>Se notifica que hay baja o nula disponibilidad de los productos mencionados.</p>
            <button class="boton-revisar" onclick="cerrarModal()">Revisar</button>
        </div>
    </div>
</body>
</html>
